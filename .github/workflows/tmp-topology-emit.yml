name: Temporary topology emitter

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-topology-emit.yml"

permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.13"
      - name: Generate and emit topology
        run: |
          uv run python scripts/gen_workflow_topology.py --update
          python - <<'PY'
          import base64
          from pathlib import Path
          data = Path("docs/operations/ci-topology.md").read_bytes()
          print("TOPOLOGY_B64_BEGIN")
          print(base64.b64encode(data).decode("ascii"))
          print("TOPOLOGY_B64_END")
          PY
