name: Temporary topology emitter

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-topology-emit.yml"

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.13"
      - name: Generate final topology without this validation helper
        run: |
          mv .github/workflows/tmp-topology-emit.yml /tmp/tmp-topology-emit.yml
          uv run python scripts/gen_workflow_topology.py --update
      - name: Commit exact generated report to the PR head
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/ci-topology.md
          if git diff --cached --quiet; then
            echo "Topology already exact."
            exit 0
          fi
          git commit -m "docs(ci): regenerate topology after producer hardening"
          git push origin "HEAD:${HEAD_REF}"
